<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:700 22px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:17px "Microsoft YaHei",sans-serif;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">多雷达拼接的三类收益</text>
  <rect x="35" y="82" width="350" height="285" rx="20" class="card"/>
  <rect x="425" y="82" width="350" height="285" rx="20" class="card"/>
  <rect x="815" y="82" width="350" height="285" rx="20" class="card"/>
  <rect x="145" y="188" width="130" height="60" rx="18" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
  <circle cx="178" cy="252" r="17" fill="#1e293b"/><circle cx="242" cy="252" r="17" fill="#1e293b"/>
  <g fill="none" stroke-width="4">
    <path d="M210 220 A130 110 0 0 1 330 160" stroke="#2563eb"/>
    <path d="M210 220 A130 110 0 0 0 85 160" stroke="#16a34a"/>
    <path d="M210 220 A130 110 0 0 1 330 290" stroke="#f97316"/>
