  </g>
  <text x="210" y="320" text-anchor="middle" class="label">扩大观察范围</text>
  <text x="210" y="346" text-anchor="middle" class="sub">覆盖更多方向，减少盲区</text>
  <g fill="#2563eb">
    <circle cx="480" cy="145" r="5"/><circle cx="510" cy="165" r="5"/><circle cx="545" cy="140" r="5"/>
    <circle cx="575" cy="175" r="5"/><circle cx="610" cy="150" r="5"/><circle cx="650" cy="180" r="5"/>
    <circle cx="690" cy="148" r="5"/><circle cx="720" cy="175" r="5"/><circle cx="500" cy="230" r="5"/>
    <circle cx="535" cy="210" r="5"/><circle cx="570" cy="245" r="5"/><circle cx="605" cy="215" r="5"/>
  </g>
  <g fill="#f97316">
    <circle cx="492" cy="152" r="5"/><circle cx="522" cy="172" r="5"/><circle cx="557" cy="147" r="5"/>
    <circle cx="587" cy="182" r="5"/><circle cx="622" cy="157" r="5"/><circle cx="662" cy="187" r="5"/>
    <circle cx="702" cy="155" r="5"/><circle cx="732" cy="182" r="5"/><circle cx="512" cy="237" r="5"/>
    <circle cx="547" cy="217" r="5"/><circle cx="582" cy="252" r="5"/><circle cx="617" cy="222" r="5"/>
  </g>
  <path d="M485 270 Q600 300 720 250" fill="none" stroke="#64748b" stroke-width="5"/>
  <text x="600" y="320" text-anchor="middle" class="label">增加点的密度</text>
  <text x="600" y="346" text-anchor="middle" class="sub">同一物体的轮廓更完整</text>
  <rect x="935" y="155" width="110" height="115" rx="12" fill="#475569"/>
  <circle cx="895" cy="220" r="22" fill="#2563eb"/>
  <circle cx="1085" cy="220" r="22" fill="#f97316"/>
  <path d="M895 220 L935 155 L935 270 Z" fill="#bfdbfe" opacity=".8"/>
  <path d="M1085 220 L1045 155 L1045 270 Z" fill="#fed7aa" opacity=".8"/>
  <circle cx="992" cy="290" r="18" fill="#16a34a"/>
  <text x="990" y="320" text-anchor="middle" class="label">减少遮挡影响</text>
  <text x="990" y="346" text-anchor="middle" class="sub">一个方向被挡，另一个仍可能看到</text>
  <rect x="260" y="385" width="680" height="32" rx="16" fill="#fff7ed"/>
  <text x="600" y="408" text-anchor="middle" class="sub" fill="#9a3412">前提：坐标标定与时间同步准确，否则会产生重影</text>
