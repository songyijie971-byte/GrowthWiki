<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <defs>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:700 22px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:18px "Microsoft YaHei",sans-serif;fill:#475569}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">LiDAR 如何形成点云</text>
  <rect x="55" y="86" width="280" height="288" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <ellipse cx="195" cy="202" rx="70" ry="26" fill="#0f172a"/>
  <rect x="153" y="145" width="84" height="65" rx="18" fill="#334155"/>
  <rect x="169" y="116" width="52" height="34" rx="8" fill="#38bdf8" stroke="#0f172a" stroke-width="4"/>
  <g fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="5 8">
    <ellipse cx="195" cy="205" rx="105" ry="58"/><ellipse cx="195" cy="205" rx="130" ry="85"/>
  </g>
  <text x="195" y="330" text-anchor="middle" class="label">1. 发射并接收激光</text>
  <text x="195" y="355" text-anchor="middle" class="sub">测出距离和方向</text>
  <line x1="355" y1="230" x2="430" y2="230" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="455" y="86" width="290" height="288" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M500 278 L565 197 L620 263 L690 166" fill="none" stroke="#94a3b8" stroke-width="5"/>
  <g fill="#2563eb">
    <circle cx="500" cy="278" r="7"/><circle cx="515" cy="260" r="7"/><circle cx="532" cy="238" r="7"/>
    <circle cx="548" cy="219" r="7"/><circle cx="565" cy="197" r="7"/><circle cx="583" cy="219" r="7"/>
    <circle cx="602" cy="246" r="7"/><circle cx="620" cy="263" r="7"/><circle cx="638" cy="238" r="7"/>
    <circle cx="655" cy="214" r="7"/><circle cx="672" cy="190" r="7"/><circle cx="690" cy="166" r="7"/>
  </g>
  <text x="600" y="330" text-anchor="middle" class="label">2. 计算 XYZ 坐标</text>
  <text x="600" y="355" text-anchor="middle" class="sub">每次反射对应一个空间点</text>
  <line x1="765" y1="230" x2="840" y2="230" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="865" y="86" width="280" height="288" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <g fill="#16a34a">
    <circle cx="910" cy="270" r="4"/><circle cx="925" cy="255" r="4"/><circle cx="945" cy="245" r="4"/>
    <circle cx="965" cy="230" r="4"/><circle cx="985" cy="225" r="4"/><circle cx="1005" cy="210" r="4"/>
    <circle cx="1025" cy="215" r="4"/><circle cx="1045" cy="230" r="4"/><circle cx="1065" cy="240" r="4"/>
    <circle cx="1088" cy="260" r="4"/><circle cx="920" cy="290" r="4"/><circle cx="950" cy="282" r="4"/>
    <circle cx="980" cy="275" r="4"/><circle cx="1010" cy="270" r="4"/><circle cx="1040" cy="282" r="4"/>
    <circle cx="1075" cy="292" r="4"/><circle cx="940" cy="190" r="4"/><circle cx="968" cy="177" r="4"/>
    <circle cx="998" cy="168" r="4"/><circle cx="1030" cy="177" r="4"/><circle cx="1060" cy="193" r="4"/>
  </g>
  <text x="1005" y="330" text-anchor="middle" class="label">3. 点集合成为点云</text>
  <text x="1005" y="355" text-anchor="middle" class="sub">原始点还不知道物体类别</text>
</svg>
