  <ellipse cx="604" cy="251" rx="65" ry="50" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="326" text-anchor="middle" class="label">聚类</text>
  <text x="600" y="352" text-anchor="middle" class="sub">按距离把点分成若干组</text>
  <g fill="#2563eb" opacity=".9">
    <circle cx="917" cy="155" r="5"/><circle cx="950" cy="135" r="5"/><circle cx="982" cy="158" r="5"/>
