    <circle cx="1017" cy="147" r="5"/><circle cx="1050" cy="170" r="5"/><circle cx="1085" cy="150" r="5"/>
    <circle cx="936" cy="215" r="5"/><circle cx="976" cy="201" r="5"/><circle cx="1016" cy="220" r="5"/>
