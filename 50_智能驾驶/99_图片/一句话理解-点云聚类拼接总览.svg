  <text x="200" y="352" text-anchor="middle" class="sub">大量带 XYZ 坐标的空间点</text>
  <g fill="#f97316">
    <circle cx="500" cy="150" r="6"/><circle cx="528" cy="135" r="6"/><circle cx="555" cy="158" r="6"/>
    <circle cx="516" cy="184" r="6"/><circle cx="548" cy="190" r="6"/>
  </g>
  <g fill="#2563eb">
    <circle cx="638" cy="142" r="6"/><circle cx="670" cy="157" r="6"/><circle cx="704" cy="140" r="6"/>
    <circle cx="652" cy="183" r="6"/><circle cx="691" cy="190" r="6"/>
  </g>
  <g fill="#16a34a">
