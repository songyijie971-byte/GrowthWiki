  <path d="M900 255 H1100" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <text x="1000" y="326" text-anchor="middle" class="label">点云拼接</text>
  <text x="1000" y="352" text-anchor="middle" class="sub">统一坐标系后合并多份点云</text>
  <line x1="372" y1="222" x2="422" y2="222" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="772" y1="222" x2="822" y2="222" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
