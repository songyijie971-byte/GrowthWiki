<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:700 24px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:18px "Microsoft YaHei",sans-serif;fill:#475569}
      .card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">点云 → 聚类 → 点云拼接</text>
  <rect x="40" y="82" width="320" height="285" rx="20" class="card"/>
  <rect x="440" y="82" width="320" height="285" rx="20" class="card"/>
  <rect x="840" y="82" width="320" height="285" rx="20" class="card"/>
  <g fill="#64748b">
    <circle cx="105" cy="160" r="5"/><circle cx="130" cy="142" r="5"/><circle cx="155" cy="170" r="5"/>
    <circle cx="185" cy="150" r="5"/><circle cx="210" cy="176" r="5"/><circle cx="238" cy="154" r="5"/>
    <circle cx="276" cy="188" r="5"/><circle cx="302" cy="145" r="5"/><circle cx="114" cy="215" r="5"/>
