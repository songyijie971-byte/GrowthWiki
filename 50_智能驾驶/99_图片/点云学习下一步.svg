  <circle cx="885" cy="130" r="28" fill="#7c3aed"/><text x="885" y="142" text-anchor="middle" class="num">3</text>
  <rect x="900" y="170" width="210" height="115" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="925" y="205" class="sub">□ LiDAR 型号</text>
  <text x="925" y="235" class="sub">□ PointCloud2 Topic</text>
  <text x="925" y="265" class="sub">□ rosbag 与对应功能包</text>
