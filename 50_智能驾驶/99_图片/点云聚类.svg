<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <style>
      .title{font:700 30px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .label{font:700 22px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:18px "Microsoft YaHei",sans-serif;fill:#475569}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#fff"/>
  <text x="600" y="48" text-anchor="middle" class="title">聚类：不移动点，只给邻近点分组</text>
  <rect x="55" y="88" width="430" height="275" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g fill="#64748b">
    <circle cx="115" cy="145" r="6"/><circle cx="145" cy="162" r="6"/><circle cx="177" cy="143" r="6"/>
    <circle cx="202" cy="175" r="6"/><circle cx="238" cy="154" r="6"/><circle cx="265" cy="185" r="6"/>
    <circle cx="312" cy="148" r="6"/><circle cx="346" cy="175" r="6"/><circle cx="390" cy="155" r="6"/>
    <circle cx="425" cy="190" r="6"/><circle cx="130" cy="230" r="6"/><circle cx="170" cy="260" r="6"/>
    <circle cx="215" cy="232" r="6"/><circle cx="260" cy="278" r="6"/><circle cx="310" cy="242" r="6"/>
    <circle cx="355" cy="285" r="6"/><circle cx="405" cy="245" r="6"/>
  </g>
  <text x="270" y="334" text-anchor="middle" class="label">同一份原始点云</text>
  <line x1="510" y1="226" x2="650" y2="226" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="580" y="199" text-anchor="middle" class="sub">按距离阈值分组</text>
  <rect x="675" y="88" width="470" height="275" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="780" cy="185" rx="72" ry="65" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <ellipse cx="930" cy="168" rx="70" ry="58" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <ellipse cx="1015" cy="270" rx="78" ry="55" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <g fill="#f97316">
    <circle cx="748" cy="160" r="7"/><circle cx="782" cy="145" r="7"/><circle cx="812" cy="168" r="7"/>
    <circle cx="760" cy="205" r="7"/><circle cx="798" cy="215" r="7"/>
  </g>
  <g fill="#2563eb">
    <circle cx="900" cy="148" r="7"/><circle cx="930" cy="130" r="7"/><circle cx="961" cy="156" r="7"/>
    <circle cx="912" cy="190" r="7"/><circle cx="950" cy="197" r="7"/>
  </g>
  <g fill="#16a34a">
    <circle cx="980" cy="254" r="7"/><circle cx="1014" cy="238" r="7"/><circle cx="1048" cy="260" r="7"/>
    <circle cx="995" cy="292" r="7"/><circle cx="1034" cy="300" r="7"/>
  </g>
  <text x="910" y="340" text-anchor="middle" class="label">点的位置不变，组别变了</text>
  <text x="600" y="404" text-anchor="middle" class="sub">阈值过小会拆得太碎；阈值过大会把相邻物体并在一起</text>
</svg>
